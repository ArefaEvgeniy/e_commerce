{% extends 'base.html' %}
{% load i18n %}

{% block head %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>
<script src="https://js.stripe.com/v3/"></script>
{% endblock %}

{% block content %}
    <div>
        <h1>{% translate "Оплата замовлення" %} #{{ order.id }}</h1>
        <div>
            <label for="amount">{% translate "Сума:" %}</label>
            <input type="text" id="amount" name="amount" value="{{ order.total_price|default:100 }}" min="0.50" step="0.01">
        </div>
        <div>
            <label for="currency">{% translate "Валюта:" %}</label>
            <select id="currency">
                <option value="usd" selected>USD</option>
                <option value="eur">EUR</option>
                <option value="uah">UAH</option>
            </select>
        </div>
        <div>
            <label for="description">{% translate "Опис платежу:" %}</label>
            <input id="description" name="description" type="text" placeholder="Опис платежу(опційно)">
        </div>
        <div>
            <label>{% translate "Дані картки:" %}</label>
            <div id="payment-element"></div>
        </div>
        <button id="submit-btn" disabled>{% translate "Оплатити" %}</button>
        <div id="message"></div>
    </div>
    <script>
        const STRIPE_PUBLIC_KEY = '{{ stripe_publishable_key }}';
        const API_URL = '/payments/payments';
        const orderId = '{{ order.id }}';
        const amount = document.getElementById('amount').value.replace(',', '.');

        const stripe = Stripe(STRIPE_PUBLIC_KEY);
        let elements, paymentElement, clientSecret, paymentId;

        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');

        async function createPaymentIntent() {
            const csrfToken = getCookie('csrftoken');
            const response = await fetch(`${API_URL}/create_payment_intent/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({
                    amount: amount,
                    currency: document.getElementById('currency').value,
                    description: document.getElementById('description').value
                })
            });
            if ( !response.ok) {
                const err = await response.json();
                throw new Error(err.error || `HTTP ${response.status}`);
            }
            const data = await response.json();
            if (!data.client_secret || !data.payment_id) {
                throw new Error('Invalid response from server');
            }
            clientSecret = data.client_secret;
            paymentId = data.payment_id;
            return data;
        }

        async function mountPaymentElement() {
            await createPaymentIntent();

            elements = stripe.elements({
                clientSecret: clientSecret,
                appearance: {theme: 'stripe',}
            });

            paymentElement = elements.create('payment', {layout: 'tabs'});
            paymentElement.mount('#payment-element');
            submitBtn.disabled = false;
        }

        async function handlePayment() {
            submitBtn.disabled = true;

            try {
                const { error, paymentIntent } = await stripe.confirmPayment({
                    elements,
                    confirmParams: {
                        return_url: window.location.origin + '/checkout/?success=true',
                    },
                    redirect: 'if_required',
                })

                if ( error ) {
                    messageDiv.textContent = error.message;
                } else if ( paymentIntent && paymentIntent.status === 'succeeded' ) {
                    messageDiv.textContent = 'Оплата успішна!';
                    confirmOnBackend(paymentId);
                } else if (paymentIntent) {
                    messageDiv.textContent = `Статус платежу: ${paymentIntent.status}`;
                } else {
                    messageDiv.textContent = 'Оплата не завершена. Спробуйте ще раз.';
                }
            } catch ( error ) {
                messageDiv.textContent = `Помилка: ${error.message}`;
            } finally {
                submitBtn.disabled = false;
            }
        }

        async function confirmOnBackend(paymentId) {
            try {
                await fetch (`${API_URL}/${paymentId}/confirm/?order_id=${orderId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                });
            } catch (error) {
                console.error('Помилка підтвердження на бекенді:', error);
            }
        }

        getCookie = (name) => {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            submitBtn.addEventListener('click', handlePayment);
            mountPaymentElement().catch(error => {
                messageDiv.textContent = `Помилка ініціалізації: ${error.message}`;
            })
        })

        if ( new URLSearchParams(window.location.search).get('success') === 'true' ) {
            document.addEventListener('DOMContentLoaded', () => {
                messageDiv.textContent = 'Оплата успішна! Дякуємо за покупку.';
            });
        }
    </script>
{% endblock %}
