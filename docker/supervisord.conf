[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


; --------------------------------------------------
; PostgreSQL
; --------------------------------------------------

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data -c listen_addresses=127.0.0.1
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0


; --------------------------------------------------
; Redis
; --------------------------------------------------

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
priority=20
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0


; --------------------------------------------------
; MinIO
; --------------------------------------------------

[program:minio]
command=/usr/local/bin/silo server /data --address :9000 --console-address :9001
priority=30
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0


; --------------------------------------------------
; Nginx
; --------------------------------------------------

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0


; --------------------------------------------------
; Django primary
; --------------------------------------------------

[program:app]
command=/start-app.sh primary
priority=50
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0


; --------------------------------------------------
; Django duplicate
; --------------------------------------------------

[program:app_dupe]
command=/start-app.sh duplicate
priority=60
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0


; --------------------------------------------------
; Celery worker
; --------------------------------------------------

[program:celery_worker]
command=/bin/bash -c "until [ -f /tmp/migrations.done ]; do sleep 2; done; exec celery -A e_commerce worker --loglevel=info"
priority=70
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0


