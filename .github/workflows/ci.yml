name: Pipelines for E-commerce Project
on:
    push:
        branches:
          - main
    pull_request:
        branches:
          - main

jobs:
    lint:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install flake8

            - name: Run flake8
              run: flake8 payments --exclude=migrations --max-line-length=120

    test:
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: postgres:latest
                env:
                    POSTGRES_DB: test_db
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                ports:
                    - 5432:5432
            redis:
                image: redis:7
                ports:
                  - 6379:6379
                options: >-
                  --health-cmd "redis-cli ping"
                  --health-interval 10s
                  --health-timeout 5s
                  --health-retries 5
        env:
            DJANGO_SETTINGS_MODULE: e_commerce.settings
            # Django
            SECRET_KEY: ci-only-django-secret-key-change-me
            DEBUG: "False"
            ALLOWED_HOSTS: localhost,127.0.0.1
            # PostgreSQL
            DB_NAME: test_db
            DB_USER: test_user
            DB_PASSWORD: test_password
            DB_HOST: 127.0.0.1
            DB_PORT: "5432"
            # Celery / Redis
            CELERY_BROKER_URL: redis://127.0.0.1:6379/0
            CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
            # Stripe: placeholders only; do not use for real API calls
            STRIPE_SECRET_KEY: sk_test_placeholder
            STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
            # Email: placeholders only; do not send real emails
            DEFAULT_EMAIL_FROM: ci@example.com
            APP_MAIL_PWD: ci-placeholder
            EMAIL_HOST_USER: ci@example.com
            EMAIL_HOST_PASSWORD: ci-placeholder
            # S3: placeholders only; do not perform real S3 operations
            AWS_ACCESS_KEY_ID: ci-placeholder
            AWS_SECRET_KEY: ci-placeholder
            AWS_S3_ENDPOINT_URL: http://127.0.0.1:9000
            AWS_S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
            AWS_STORAGE_BUCKET_NAME: ci-test-bucket
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Install migrations
              run: |
                  python manage.py makemigrations
                  python manage.py migrate

            - name: Run tests
              run: |
                    python manage.py test --settings=e_commerce.settings
