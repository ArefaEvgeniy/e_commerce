name: Pipelines for E-commerce Project
on:
    push:
        branches:
          - main
    pull_request:
        branches:
          - main

jobs:
    lint:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install flake8

            - name: Run flake8
              run: flake8 payments --exclude=migrations --max-line-length=120

    test:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Install migrations
              run: |
                  python manage.py makemigrations
                  python manage.py migrate
              env:
                  DJANGO_SETTINGS_MODULE: e_commerce.settings

            - name: Run tests
              run: |
                   pythom manage.py test shop
              env:
                  DJANGO_SETTINGS_MODULE: e_commerce.settings