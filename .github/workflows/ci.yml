name: Pipelines for E-commerce Project
on:
    push:
        branches:
          - main
    pull_request:
        branches:
          - main

jobs:
    lint:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install flake8

            - name: Run flake8
              run: flake8 payments --exclude=migrations --max-line-length=120

    test:
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: test_db
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                ports:
                    - 5432:5432

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: PSQL test
              if: failure()
              run: |
                  nc -zv localhost 5432
                  psql -h localhost -U postgres -c "SELECT version();" 2>&1 || echo "Connection failed"
              env:
                POSTGRES_PASSWORD: test_password

            - name: Run migrations
              run: |
                  python manage.py migrate
              env:
                DJANGO_SETTINGS_MODULE: e_commerce.settings
                DB_NAME: test_db
                DB_USER: test_user
                DB_PASSWORD: test_password
                DB_HOST: localhost
                DB_PORT: 5432

            - name: Run tests
              run: |
                    python -m pytest tests/shop/ -v
