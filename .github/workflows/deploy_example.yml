name: Build & Push to Docker Hub

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to deploy'
                required: true
                default: 'main'

env:
    BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/e-commerce

jobs:
    deploy-to-dockerhub:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.branch }}
                  
            - name: Create .env file
              run: |
                  cat > .env << EOF
                  SECRET_KEY=${{ secrets.SECRET_KEY }}
                  ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
                  DB_NAME=${{ secrets.DB_NAME }}
                  DB_NAME=${{ secrets.DB_NAME }}
                  DB_USER=${{ secrets.DB_USER }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  DB_HOST=${{ secrets.DB_HOST }}
                  DB_PORT=${{ secrets.DB_PORT }}
                  DEFAULT_EMAIL_FROM=${{ secrets.DEFAULT_EMAIL_FROM }}
                  APP_MAIL_PWD=${{ secrets.APP_MAIL_PWD }}
                  EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
                  EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
                  STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
                  STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
                  CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
                  CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}
                  AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
                  AWS_S3_ENDPOINT_URL=${{ secrets.AWS_S3_ENDPOINT_URL }}
                  AWS_S3_PUBLIC_ENDPOINT_URL=${{ secrets.AWS_S3_PUBLIC_ENDPOINT_URL }}
                  AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Extract metadata
              id: meta-backend
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.BACKEND_IMAGE }}
                  tags: |
                    type=raw,value=latest,enable=${{ inputs.branch == 'main' }}
                    type=sha,prefix=,suffix=,format=short

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  dockerfile: ./Dockerfile
                  push: true
                  tags: |
                      ${{ steps.meta-backend.outputs.tags }}
                      ${{ env.BACKEND_IMAGE }}:latest
                  labels: ${{ steps.meta-backend.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      BUILD_VERSION=${{ github.sha }}
