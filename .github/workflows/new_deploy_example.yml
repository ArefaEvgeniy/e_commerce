name: Build & Push to Docker Hub

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main

jobs:
  deploy-to-dockerhub:
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      # --------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # Docker Hub login
      # --------------------------------------------------

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------------------
      # Image metadata
      # --------------------------------------------------

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: faen79/e-commerce
          tags: |
            type=raw,value=latest,enable=${{ inputs.branch == 'main' }}
            type=sha,format=short

      # --------------------------------------------------
      # Build and push
      # --------------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          build-args: |
            BUILD_VERSION=${{ github.sha }}

            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}

            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            DEFAULT_EMAIL_FROM=${{ secrets.DEFAULT_EMAIL_FROM }}
            APP_MAIL_PWD=${{ secrets.APP_MAIL_PWD }}
            EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
            EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}

            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}

            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            AWS_S3_PUBLIC_ENDPOINT_URL=${{ secrets.AWS_S3_PUBLIC_ENDPOINT_URL }}
            AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}